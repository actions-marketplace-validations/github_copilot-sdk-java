name: "Copilot Setup Steps"

# This workflow configures the environment for GitHub Copilot Agent with gh-aw MCP server
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called 'copilot-setup-steps' to be recognized by GitHub Copilot Agent
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set minimal permissions for setup steps
    # Copilot Agent receives its own token with appropriate permissions
    permissions:
      contents: read

    steps:
      # Clone the repository
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      # Install GitHub CLI and gh-aw extension for Copilot Agent interaction
      - name: Install gh-aw extension
        uses: github/gh-aw/actions/setup-cli@9441310fb463ae6c16e58a793e8cb1796c49d053 # v0.80.5
        with:
          version: v0.68.3

      # Setup Node.js
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      # Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Enable repository pre-commit hooks (including Spotless checks for relevant source changes)
      - name: Enable pre-commit hooks
        run: git config core.hooksPath .githooks

      # Verify installations
      - name: Verify tool installations
        run: |
          echo "=== Verifying installations ==="
          node --version
          npm --version
          java -version
          gh --version
          gh aw version
          echo "--- Git hooks path ---"
          git config core.hooksPath
          echo "✅ All tools installed successfully"
