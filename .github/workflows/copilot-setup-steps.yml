name: "Copilot Setup Steps"

# This workflow configures the environment for GitHub Copilot Agent with gh-aw MCP server
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called 'copilot-setup-steps' to be recognized by GitHub Copilot Agent
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set minimal permissions for setup steps
    # Copilot Agent receives its own token with appropriate permissions
    permissions:
      contents: read

    steps:
      # Clone the repository
      - name: Checkout repository
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      # Install GitHub CLI and gh-aw extension for Copilot Agent interaction
      - name: Install gh-aw extension
        uses: github/gh-aw/actions/setup-cli@bbb8042878459948333b15b66f27113f4b5c1b9a # v0.83.4
        with:
          version: v0.68.3

      # Setup Node.js
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      # Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Enable repository pre-commit hooks (including Spotless checks for relevant source changes)
      - name: Enable pre-commit hooks
        run: git config core.hooksPath .githooks

      # Verify installations
      - name: Verify tool installations
        run: |
          echo "=== Verifying installations ==="
          node --version
          npm --version
          java -version
          gh --version
          gh aw version
          echo "--- Git hooks path ---"
          git config core.hooksPath
          echo "✅ All tools installed successfully"
